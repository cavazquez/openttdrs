# Configuración recomendada por Bevy para desarrollo:
#
# - Las dependencias compilan con opt-level=3 (recomendación oficial de Bevy):
#   el hot path de render (bevy/wgpu) vive en dependencias y con 1 el cliente
#   rinde notablemente peor. Se compilan una sola vez y quedan cacheadas.
#   Sin debuginfo en dependencias (debug=false) para reducir la memoria que
#   consume lld al enlazar (histórico OOM/bus-error con inputs muy grandes).
# - El código propio usa opt-level=1: compilación incremental rápida.
#
# Rust 1.98 + rust-lld puede producir símbolos ocultos sin resolver al enlazar
# el binario de pruebas completo de Bevy (aunque `cargo check` pase). CI ya
# instala `mold` mediante `.github/apt-packages.txt`; usarlo también aquí hace
# reproducible la ruta local y evita depender de artefactos incrementales del
# enlazador integrado.
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# Para producción: cargo run --release
# Iteración local con Bevy enlazado dinámicamente: cargo client (ver alias abajo)

[alias]
client = "run -p openttdrs-client --features dynamic_linking"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
debug = false
