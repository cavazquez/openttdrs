# Optimizaciones recomendadas por Bevy para desarrollo:
# - Las dependencias (incluyendo Bevy) se compilan con opt-level=3
#   → el motor corre a velocidad casi-release mientras se desarrolla.
# - El código propio usa opt-level=1 para compilaciones rápidas.
# - La recompilación incremental sigue siendo rápida (solo el crate propio).
#
# Para producción: cargo run --release (opt-level=3 en todo).

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
