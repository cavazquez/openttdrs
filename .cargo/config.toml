# Configuración recomendada por Bevy para desarrollo:
#
# - Las dependencias compilan con opt-level=3 (recomendación oficial de Bevy):
#   el hot path de render (bevy/wgpu) vive en dependencias y con 1 el cliente
#   rinde notablemente peor. Se compilan una sola vez y quedan cacheadas.
#   Sin debuginfo en dependencias (debug=false) para reducir la memoria que
#   consume lld al enlazar (histórico OOM/bus-error con inputs muy grandes).
# - El código propio usa opt-level=1: compilación incremental rápida.
#
# No fijar mold/clang aquí: en CI (ubuntu-latest) suele faltar mold y clang rechaza
# -fuse-ld=mold. Opcional en tu máquina (~/.cargo/config.toml o override local):
#   [target.x86_64-unknown-linux-gnu]
#   linker = "clang"
#   rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# Para producción: cargo run --release

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
debug = false
