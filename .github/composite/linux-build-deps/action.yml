name: Linux build dependencies
description: Librerías de sistema para Bevy (X11, Vulkan, ALSA) con caché APT fiable
runs:
  using: composite
  steps:
    - name: Lista de paquetes
      id: apt
      shell: bash
      run: |
        pkgs=$(grep -v '^#' .github/apt-packages.txt | grep -v '^[[:space:]]*$' | xargs)
        echo "packages=$pkgs" >> "$GITHUB_OUTPUT"

    # actions/cache@v4 sobre /var/cache/apt falla (tar exit 2: permisos root).
    # gerlero/apt-install cachea .deb en ruta escribible por el runner.
    - name: Instalar paquetes APT
      uses: gerlero/apt-install@v1
      with:
        packages: ${{ steps.apt.outputs.packages }}
        install-recommends: false
        install-suggests: false
