name: Rust toolchain + caché + deps Linux
description: Rust 1.97, rust-cache compartido y paquetes APT para Bevy (X11/Wayland/Vulkan/ALSA)
inputs:
  components:
    description: Componentes rustup (p. ej. rustfmt, clippy)
    required: false
    default: ""
  cache-key:
    description: >-
      shared-key de rust-cache. Las corridas que compilan con instrumentación
      de cobertura (push a main) deben usar una clave propia: sus artefactos
      (RUSTFLAGS distintos) no se guardan en la caché de los PRs, que ya
      existe y queda «up-to-date», y cada push recompilaba todo desde cero.
    required: false
    default: openttdrs
runs:
  using: composite
  steps:
    - name: Instalar Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.97.1
        components: ${{ inputs.components }}

    - name: caché cargo
      uses: Swatinem/rust-cache@v2.9.1
      with:
        shared-key: ${{ inputs.cache-key }}
        add-job-id-key: false
        cache-on-failure: true

    - name: Dependencias Linux
      uses: ./.github/composite/linux-build-deps
