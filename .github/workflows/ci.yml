name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: caché cargo
        uses: Swatinem/rust-cache@v2

      - name: Dependencias Linux (X11 / Vulkan software)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libssl-dev \
            libvulkan1 \
            mesa-vulkan-drivers

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: Golden parse_sav (tests/fixtures)
        run: python3 scripts/verify_parse_sav_reference.py

      - name: Sintaxis Python (scripts)
        run: |
          python3 -m py_compile scripts/parse_sav.py
          python3 -m py_compile scripts/verify_parse_sav_reference.py
          python3 -m py_compile scripts/emit_parse_sav_golden.py

      - name: build (incluye cliente Bevy)
        run: cargo build --workspace
