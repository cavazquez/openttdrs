name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE: ci
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  # Enlazado más rápido (mold en .github/apt-packages.txt).
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

jobs:
  # Un solo job: clippy compila una vez; nextest reutiliza binarios (--no-build).
  # En push a main, llvm-cov nextest sustituye a nextest (2ª compilación instrumentada,
  # pero sin un segundo job ni checkout/caché/APT duplicados).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Entorno Rust
        uses: ./.github/composite/rust-setup
        with:
          components: rustfmt, clippy, llvm-tools-preview
          # En main la compilación es instrumentada (llvm-cov): caché propia,
          # si no cada push recompila los ~12 min de instrumentación de cero.
          cache-key: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'openttdrs-cov' || 'openttdrs' }}

      - name: Instalar cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy (compila workspace + tests + examples)
        run: cargo clippy --workspace --all-targets --profile ci -- -D warnings

      - name: rustdoc (validar documentación del workspace)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: ""

      - name: Instalar cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.1

      - name: Instalar cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      - name: cargo audit (vulnerabilidades)
        run: cargo audit

      - name: cargo deny check (licencias, advisories, sources, bans)
        run: cargo deny check

      - name: Instalar cargo-llvm-cov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: tests (nextest, sin recompilar)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: cargo nextest run --workspace --profile ci --no-build

      - name: tests + cobertura (main, recompila con instrumentación)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cargo llvm-cov nextest --workspace --all-targets --profile ci --lcov --output-path lcov.info

      - name: Upload coverage reports to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false

      - name: Artefacto LCOV
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info

      # TNBP + Python: misma entrada que `./scripts/check.sh ci` (#120).
      # Excepciones solo-GHA: rustdoc, audit, deny, llvm-cov en main,
      # y fetch OpenTTD para regenerate de tablas (#119).
      - name: Validar TNBP (fixture v5p12_tnbp.ottdmap)
        run: ./scripts/check.sh tnbp

      - name: Checks Python compartidos (golden + py_compile + runs)
        run: ./scripts/check.sh ci-python

      - name: Tablas generadas reproducibles (#119)
        run: ./scripts/check.sh generated-tables-ci
