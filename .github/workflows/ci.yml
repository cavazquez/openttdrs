name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: caché cargo
        uses: Swatinem/rust-cache@v2

      - name: Dependencias Linux (X11 / Vulkan software)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libssl-dev \
            libvulkan1 \
            mesa-vulkan-drivers

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Instalar cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Tests y cobertura (llvm-cov → LCOV)
        run: cargo llvm-cov --workspace --all-targets --lcov --output-path lcov.info

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
          verbose: true

      - name: Artefacto LCOV
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info

      - name: Validar TNBP (fixture v5p12_tnbp.ottdmap)
        run: cargo run -q -p openttdrs-core --example validate_ottdmap_tnbp -- crates/openttdrs-core/tests/fixtures/v5p12_tnbp.ottdmap

      - name: Golden parse_sav (tests/fixtures)
        run: python3 scripts/verify_parse_sav_reference.py

      - name: Sintaxis Python (scripts)
        run: |
          python3 -m py_compile scripts/parse_sav.py
          python3 -m py_compile scripts/verify_parse_sav_reference.py
          python3 -m py_compile scripts/emit_parse_sav_golden.py
          python3 -m py_compile scripts/gen_tnbp_fixture_ottdmap.py

      - name: build (incluye cliente Bevy)
        run: cargo build --workspace
