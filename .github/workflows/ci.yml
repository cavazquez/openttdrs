name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE: ci
  # Enlazado más rápido (mold en .github/apt-packages.txt).
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

jobs:
  # Un solo job: evita compilar el workspace dos veces (lint ∥ tests duplicaba Bevy).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Entorno Rust
        uses: ./.github/composite/rust-setup
        with:
          components: rustfmt, clippy

      - name: Instalar cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --profile ci -- -D warnings

      - name: tests (nextest)
        run: cargo nextest run --workspace --cargo-profile ci

      - name: Validar TNBP (fixture v5p12_tnbp.ottdmap)
        run: cargo run -q -p openttdrs-core --profile ci --example validate_ottdmap_tnbp -- crates/openttdrs-core/tests/fixtures/v5p12_tnbp.ottdmap

      - name: Golden parse_sav (tests/fixtures)
        run: |
          python3 scripts/verify_parse_sav_reference.py
          python3 scripts/verify_parse_sav_water_m5.py

      - name: Sintaxis Python (scripts)
        run: |
          python3 -m py_compile scripts/parse_sav.py
          python3 -m py_compile scripts/verify_parse_sav_reference.py
          python3 -m py_compile scripts/verify_parse_sav_water_m5.py
          python3 -m py_compile scripts/emit_parse_sav_golden.py
          python3 -m py_compile scripts/gen_tnbp_fixture_ottdmap.py
          python3 -m py_compile scripts/audit_sp3_assets.py

  # Tras `check`: reutiliza caché cargo (shared-key) ya caliente; evita compilar Bevy
  # en paralelo con CI en cada push a main (~5–8 min ahorrados).
  coverage:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Entorno Rust
        uses: ./.github/composite/rust-setup
        with:
          components: llvm-tools-preview

      - name: Instalar cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Tests y cobertura (llvm-cov → LCOV)
        run: cargo llvm-cov --workspace --all-targets --lcov --output-path lcov.info --profile ci

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false

      - name: Artefacto LCOV
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
