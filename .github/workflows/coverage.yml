# Cobertura automática en ci.yml (push a main, mismo job `check`).
# Este workflow queda para relanzar cobertura manualmente sin repetir CI.
name: Coverage (manual)

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE: ci
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

jobs:
  codecov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Entorno Rust
        uses: ./.github/composite/rust-setup
        with:
          components: llvm-tools-preview

      - name: Instalar cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Tests y cobertura (llvm-cov → LCOV)
        run: cargo llvm-cov --workspace --all-targets --lcov --output-path lcov.info --profile ci

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false

      - name: Artefacto LCOV
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
