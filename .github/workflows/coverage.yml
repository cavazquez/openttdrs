name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  codecov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview

      - name: caché cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: openttdrs
          add-job-id-key: false
          cache-on-failure: true

      - name: Dependencias Linux
        uses: ./.github/composite/linux-build-deps

      - name: Instalar cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Tests y cobertura (llvm-cov → LCOV)
        run: cargo llvm-cov --workspace --all-targets --lcov --output-path lcov.info

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
          verbose: true

      - name: Artefacto LCOV
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
