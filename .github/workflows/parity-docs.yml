name: Parity docs

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - "scripts/check.sh"
      - "scripts/check_parity_docs_fresh.sh"
      - "scripts/check_active_parity_backlog.py"
      - "scripts/test_parity_docs_portability.py"
      - ".github/workflows/parity-docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - "scripts/check.sh"
      - "scripts/check_parity_docs_fresh.sh"
      - "scripts/check_active_parity_backlog.py"
      - "scripts/test_parity_docs_portability.py"
      - ".github/workflows/parity-docs.yml"

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validar fuentes canónicas de paridad
        run: ./scripts/check.sh parity-docs
      - name: Validar gate con y sin ripgrep
        run: python3 scripts/test_parity_docs_portability.py
