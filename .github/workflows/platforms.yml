name: Platform check

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: cargo check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Instalar Rust fijado
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Caché Cargo
        uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: platform-${{ matrix.os }}

      - name: Compilar workspace y tests
        run: cargo check --workspace --all-targets --locked
