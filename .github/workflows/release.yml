name: Release alpha

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        name: Validar versión y tag
        shell: bash
        run: |
          version="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"])')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "El tag ${GITHUB_REF_NAME} no coincide con Cargo.toml v${version}." >&2
            exit 1
          fi
          cargo metadata --locked --no-deps --format-version 1 >/dev/null

      - name: Exigir CI y Platform verdes para un tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          required_checks=(
            "check"
            "cargo check (macos-latest)"
            "cargo check (windows-latest)"
          )
          check_runs="$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
            --jq '.check_runs[] | [.name, .conclusion] | @tsv')"
          printf '%s\n' "$check_runs"
          for required in "${required_checks[@]}"; do
            if ! printf '%s\n' "$check_runs" | grep -Fqx "${required}"$'\t'"success"; then
              echo "El SHA ${GITHUB_SHA} no tiene el check verde requerido: ${required}" >&2
              exit 1
            fi
          done

  runtime-assets:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Dependencias del pipeline OpenGFX
        run: |
          sudo apt-get update
          sudo apt-get install -y grfcodec unzip
          python3 -m pip install --user --upgrade -r scripts/requirements-assets.txt
          python3 -c 'from PIL import Image; assert hasattr(Image.Image, "get_flattened_data")'

      - name: Generar assets OpenGFX 8bpp redistribuibles
        run: ./scripts/descargar_assets.sh graficos --8bpp

      - name: Validar assets requeridos
        run: |
          test -f assets/opengfx/tiles/grass.png
          test -f assets/opengfx/tiles/vehicle_train_e.png
          test -f assets/opengfx/atlas/tiles_atlas_0.png
          test -f static/fonts/DejaVuSansMono.ttf

      - name: Assets compartidos
        uses: actions/upload-artifact@v7
        with:
          name: runtime-assets
          compression-level: 0
          retention-days: 2
          path: |
            assets/music
            assets/sounds
            assets/opengfx/tiles
            assets/opengfx/atlas
            static

  openttd-validation:
    needs: validate
    runs-on: ubuntu-latest
    env:
      OPENTTD_VERSION: "15.3"
      OPENTTD_ARCHIVE: openttd-15.3-linux-generic-amd64.tar.xz
      OPENTTD_SHA256: f49eb25d61b00f8f4d332fee02b530ad75552d1efb8f2bb01e7ca5e6540fe059
      OPENGFX_ARCHIVE: opengfx-7.1-all.zip
      OPENGFX_SHA256: 928fcf34efd0719a3560cbab6821d71ce686b6315e8825360fba87a7a94d7846
    steps:
      - uses: actions/checkout@v7

      - name: Recuperar OpenTTD 15.3 oficial desde caché
        id: openttd-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/openttdrs/openttd-15.3-linux-generic-amd64.tar.xz
            ~/.cache/openttdrs/opengfx-7.1-all.zip
          key: openttd-15.3-opengfx-7.1-f49eb25d61b0-928fcf34efd0

      - name: Descargar y verificar OpenTTD 15.3 oficial
        if: steps.openttd-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/openttdrs
          curl --fail --location --retry 3 --retry-all-errors \
            "https://cdn.openttd.org/openttd-releases/${OPENTTD_VERSION}/${OPENTTD_ARCHIVE}" \
            --output ~/.cache/openttdrs/${OPENTTD_ARCHIVE}
          curl --fail --location --retry 3 --retry-all-errors \
            "https://cdn.openttd.org/opengfx-releases/7.1/${OPENGFX_ARCHIVE}" \
            --output ~/.cache/openttdrs/${OPENGFX_ARCHIVE}
          echo "${OPENTTD_SHA256}  $HOME/.cache/openttdrs/${OPENTTD_ARCHIVE}" | sha256sum --check --strict
          echo "${OPENGFX_SHA256}  $HOME/.cache/openttdrs/${OPENGFX_ARCHIVE}" | sha256sum --check --strict

      - name: Verificar OpenTTD recuperado
        run: |
          echo "${OPENTTD_SHA256}  $HOME/.cache/openttdrs/${OPENTTD_ARCHIVE}" | sha256sum --check --strict
          echo "${OPENGFX_SHA256}  $HOME/.cache/openttdrs/${OPENGFX_ARCHIVE}" | sha256sum --check --strict

      - name: Extraer binario oficial
        run: |
          mkdir -p "$RUNNER_TEMP/openttd-validation"
          tar -xJf "$HOME/.cache/openttdrs/${OPENTTD_ARCHIVE}" -C "$RUNNER_TEMP/openttd-validation" --strip-components=1
          mkdir -p "$RUNNER_TEMP/openttd-validation/opengfx"
          unzip -q "$HOME/.cache/openttdrs/${OPENGFX_ARCHIVE}" -d "$RUNNER_TEMP/openttd-validation/opengfx"
          tar -xf "$RUNNER_TEMP/openttd-validation/opengfx/opengfx-7.1.tar" -C "$RUNNER_TEMP/openttd-validation/baseset" --strip-components=1
          test -x "$RUNNER_TEMP/openttd-validation/openttd"
          test -f "$RUNNER_TEMP/openttd-validation/baseset/opengfx.obg"

      - name: Load y roundtrip SAV sin SKIP
        env:
          OPENTTD: ${{ runner.temp }}/openttd-validation/openttd
          OPENTTDRS_OTTD_VERSION: "15.3"
          OPENTTDRS_OTTD_ARTIFACT_DIR: artifacts/openttd-validation
        run: ./scripts/validate_sav_openttd_matrix.sh

      - name: Publicar logs y SAV de validación
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openttd-15.3-sav-validation
          retention-days: 14
          if-no-files-found: error
          path: artifacts/openttd-validation

  build:
    needs: [validate, runtime-assets]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            archive: tar.gz
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            archive: zip
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-arm64
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Instalar Rust fijado
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Caché Cargo
        uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: release-${{ matrix.target }}

      - name: Dependencias Linux
        if: runner.os == 'Linux'
        uses: ./.github/composite/linux-build-deps

      - name: Descargar assets comunes
        uses: actions/download-artifact@v8
        with:
          name: runtime-assets
          path: .

      - name: Compilar cliente y servidor dedicado
        shell: bash
        run: >-
          cargo build --locked --release --target "${{ matrix.target }}"
          -p openttdrs-client --bin openttdrs-client
          -p openttdrs-net --bin openttdrs-dedicated

      - name: Empaquetar y generar SHA-256
        shell: bash
        run: >-
          ./scripts/package_release.sh
          "${{ needs.validate.outputs.version }}"
          "${{ matrix.target }}"
          "${{ matrix.platform }}"
          "${{ matrix.archive }}"

      - name: Smoke del paquete extraído
        shell: bash
        run: |
          package="dist/openttdrs-${{ needs.validate.outputs.version }}-${{ matrix.platform }}"
          suffix=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then suffix=".exe"; fi
          "${package}/openttdrs-client${suffix}" --check-assets
          (cd dist && sha256sum -c "openttdrs-${{ needs.validate.outputs.version }}-${{ matrix.platform }}.${{ matrix.archive }}.sha256")

      - name: Subir paquete
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          compression-level: 0
          retention-days: 14
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  publish:
    if: github.ref_type == 'tag'
    needs: [validate, build, openttd-validation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Descargar paquetes
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Crear prerelease o reemplazar artefactos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --prerelease \
              --title "openttdrs ${{ needs.validate.outputs.version }}" \
              --notes-file RELEASE_NOTES.md
          fi
