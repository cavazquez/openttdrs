name: Telegram commits

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  notify:
    name: Notificar commits
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PUSH_AFTER: ${{ github.sha }}
      PUSH_REPOSITORY: ${{ github.repository }}
      PUSH_BRANCH: ${{ github.ref_name }}
      PUSH_COMPARE: ${{ github.event.compare }}
      PUSH_PROJECT_LABEL: OpenTTDRS
      PUSH_DELETED: ${{ github.event.deleted }}
    steps:
      - name: Enviar resumen del push a Telegram
        # Sin los dos secrets, el workflow termina correctamente y no hace
        # ninguna petición. Así los forks y PRs no requieren credenciales.
        if: ${{ env.PUSH_DELETED != 'true' && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail

          commit_count="$(jq -r '(.commits // []) | length' "$GITHUB_EVENT_PATH")"
          subject="$(jq -r '(.head_commit.message // "") | split("\n")[0]' "$GITHUB_EVENT_PATH")"
          author="$(jq -r '.head_commit.author.username // .pusher.name // "desconocido"' "$GITHUB_EVENT_PATH")"
          short_sha="${PUSH_AFTER:0:12}"
          compare_url="$PUSH_COMPARE"
          if [[ -z "$compare_url" || "$compare_url" == "null" ]]; then
            compare_url="https://github.com/${PUSH_REPOSITORY}/commit/${PUSH_AFTER}"
          fi

          text=$(printf '🚀 %s · push recibido\nRepositorio: %s\nRef: %s\nCommit: %s\nAutor: %s\nCommits recibidos: %s\nMensaje: %s\n%s' \
            "$PUSH_PROJECT_LABEL" "$PUSH_REPOSITORY" "$PUSH_BRANCH" "$short_sha" \
            "$author" "$commit_count" "$subject" "$compare_url")

          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --request POST \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$text" \
            --data-urlencode "disable_web_page_preview=true" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"

      - name: Explicar configuración ausente
        if: ${{ env.PUSH_DELETED != 'true' && (env.TELEGRAM_BOT_TOKEN == '' || env.TELEGRAM_CHAT_ID == '') }}
        run: echo "Telegram no configurado; faltan TELEGRAM_BOT_TOKEN y/o TELEGRAM_CHAT_ID."
