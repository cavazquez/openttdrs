[workspace]
resolver = "3"
members = ["crates/openttdrs-core", "crates/openttdrs-client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "GPL-2.0"
repository = "https://github.com/cavazquez/openttdrs"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Lints que deben ser errores (graves)
unwrap_used = "warn"
expect_used = "warn"
# Lints útiles de pedantic (warn, no error)
needless_pass_by_value = "warn"
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
redundant_closure_for_method_calls = "warn"
uninlined_format_args = "warn"
inefficient_to_string = "warn"
semicolon_if_nothing_returned = "warn"

# Perfil CI: compila más rápido que `dev` (deps en opt-level 1, sin debuginfo).
# Uso: CARGO_PROFILE=ci en GitHub Actions; local: `CARGO_PROFILE=ci ./scripts/check.sh ci`
[profile.ci]
inherits = "dev"
opt-level = 1
debug = 0
incremental = false

[profile.ci.package."*"]
opt-level = 1
debug = 0
