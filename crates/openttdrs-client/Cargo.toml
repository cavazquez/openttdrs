[package]
name = "openttdrs-client"
description = "Cliente gráfico Bevy para openttdrs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "openttdrs-client"
path = "src/main.rs"

[dependencies]
# `wayland` + `x11`: en Ubuntu GNOME el dock usa app_id / .desktop; sin wayland
# la ventana va por XWayland y a menudo muestra el icono genérico (engranaje).
# Si falta `libwayland-client`, quita `wayland` y deja solo `x11`.
bevy = { version = "0.19.0", default-features = false, features = [
    "default_app",
    "std",
    "multi_threaded",
    "default_font",
    "bevy_winit",
    "wayland",
    "x11",
    "2d_bevy_render",
    "bevy_state",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_input_focus",
    "bevy_audio",
    "bevy_settings",
    "wav",
    "vorbis",
    "png",
    "debug",
] }
openttdrs-core = { path = "../openttdrs-core" }
image = { version = "0.25", default-features = false, features = ["png"] }
winit = { version = "0.30", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# Bandeja del sistema (StatusNotifierItem / AppIndicator); sin GTK.
ksni = { version = "0.3", features = ["blocking"] }
crossbeam-channel = "0.5"

[features]
# Iteración local más rápida: `cargo run -p openttdrs-client --features dynamic_linking`
# (o el alias `cargo client` en `.cargo/config.toml`). No usar en CI/release.
dynamic_linking = ["bevy/dynamic_linking"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
