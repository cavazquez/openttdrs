[package]
name = "openttdrs-client"
description = "Cliente gráfico Bevy para openttdrs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "openttdrs-client"
path = "src/main.rs"

[dependencies]
# Sin `wayland` para compilar en sistemas donde falte `libwayland-client` (solo X11).
bevy = { version = "0.19.0", default-features = false, features = [
    "default_app",
    "std",
    "multi_threaded",
    "default_font",
    "bevy_winit",
    "x11",
    "2d_bevy_render",
    "bevy_state",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_input_focus",
    "bevy_audio",
    "bevy_settings",
    "wav",
    "vorbis",
    "png",
] }
openttdrs-core = { path = "../openttdrs-core" }
image = { version = "0.25", default-features = false, features = ["png"] }
winit = { version = "0.30", default-features = false }

[features]
# Iteración local más rápida: `cargo run -p openttdrs-client --features dynamic_linking`
# (o el alias `cargo client` en `.cargo/config.toml`). No usar en CI/release.
dynamic_linking = ["bevy/dynamic_linking"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
