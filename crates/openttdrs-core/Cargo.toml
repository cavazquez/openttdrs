[package]
name = "openttdrs-core"
description = "Lógica de simulación OpenTTD-style sin motor gráfico"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Evita que `cargo bench` ejecute unittests de lib (harness de test ≠ Criterion).
[lib]
bench = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
# Descompresión de savegames OpenTTD (.sav): OTTZ = zlib, OTTX = xz/lzma.
flate2 = "1"
lzma-rs = "0.3"
# El lote de rutas independientes tras importar un SAV usa los núcleos libres
# sin cambiar el orden en que se aplican los resultados.
rayon = "1"
# Índices efímeros de simulación: hash rápido con semilla aleatoria (vehículos,
# estaciones y teselas se consultan miles de veces por tick).
ahash = "0.8"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "sim_tick"
harness = false

[[bench]]
name = "pathfinding"
harness = false

[lints]
workspace = true
